name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[dev,docs,postgres,s3]"

      - name: Run quality gate
        run: |
          python -m ruff check \
            src/hal9000/cli.py \
            src/hal9000/config.py \
            src/hal9000/db \
            src/hal9000/gateway \
            src/hal9000/release.py \
            src/hal9000/research \
            src/hal9000/security.py \
            src/hal9000/storage \
            src/hal9000/vector \
            tests/gateway/test_http.py \
            tests/test_config.py \
            tests/test_deployment_manifests.py \
            tests/test_object_store.py \
            tests/test_release.py \
            tests/test_research*.py \
            tests/test_security.py \
            tests/test_vector_store.py
          python -m pytest -q
          python -m mypy \
            src/hal9000/release.py \
            src/hal9000/security.py \
            src/hal9000/research/compliance.py \
            src/hal9000/research/queue.py \
            src/hal9000/research/retention.py
          python -m mkdocs build --strict

      - name: Verify changelog automation
        run: |
          python -m hal9000.cli release changelog \
            --version "${GITHUB_REF_NAME#v}" \
            --change "Release ${GITHUB_REF_NAME}" \
            --dry-run

      - name: Build package
        run: python -m build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hal-9000-dist
          path: dist/*
