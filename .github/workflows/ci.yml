name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  quality-gate:
    name: Python quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,postgres,s3]"

      - name: Lint rebuilt surfaces
        run: |
          python -m ruff check \
            src/hal9000/cli.py \
            src/hal9000/config.py \
            src/hal9000/db \
            src/hal9000/gateway \
            src/hal9000/research \
            src/hal9000/storage \
            src/hal9000/vector \
            tests/gateway/test_http.py \
            tests/test_config.py \
            tests/test_deployment_manifests.py \
            tests/test_object_store.py \
            tests/test_research*.py \
            tests/test_vector_store.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build docs
        run: python -m mkdocs build --strict

      - name: Smoke test migrations
        run: |
          tmpdir="$(mktemp -d)"
          tmpdb="${tmpdir}/hal9000-ci.db"
          HAL9000_DATABASE__URL="sqlite:///${tmpdb}" python -m alembic upgrade head
          rm -rf "${tmpdir}"
