# HAL 9000 production profile
#
# This is a deployment template. Replace placeholders with firm-managed
# Postgres, S3-compatible storage, secrets, and provider configuration.

hal9000:
  environment: production

  database:
    url: postgresql+psycopg://hal9000:change-me@postgres.example.com:5432/hal9000

  storage:
    backend: s3
    root_path: ./.hal9000_objects
    bucket: hal9000-production-artifacts
    prefix: production/
    region: us-east-1
    endpoint_url: null

  vector:
    backend: pgvector
    embedding_provider: fake
    embedding_dimension: 1536
    embedding_model: null
    retrieval_limit: 10

  acquisition:
    max_concurrent_downloads: 3
    rate_limit_seconds: 1.0

  gateway:
    host: 0.0.0.0
    port: 9000

  auth:
    enabled: true
    provider: oidc
    oidc_issuer_url: https://issuer.example.com/
    oidc_audience: hal-9000
    email_claim: email
    subject_claim: sub
    name_claim: name
    groups_claim: groups
    admin_groups:
      - hal:admins
    team_group_prefix: "hal:"

  log_level: INFO
  verbose: false
