name: hal9000

x-hal-env: &hal-env
  HAL9000_ENVIRONMENT: production
  HAL9000_DATABASE__URL: postgresql+psycopg://hal9000:${POSTGRES_PASSWORD:-hal9000-dev}@postgres:5432/${POSTGRES_DB:-hal9000}
  HAL9000_STORAGE__BACKEND: s3
  HAL9000_STORAGE__BUCKET: ${HAL9000_STORAGE_BUCKET:-hal9000-artifacts}
  HAL9000_STORAGE__PREFIX: ${HAL9000_STORAGE_PREFIX:-production/}
  HAL9000_STORAGE__REGION: ${HAL9000_STORAGE_REGION:-us-east-1}
  HAL9000_STORAGE__ENDPOINT_URL: http://object-store:9000
  HAL9000_VECTOR__BACKEND: pgvector
  HAL9000_VECTOR__EMBEDDING_PROVIDER: ${HAL9000_VECTOR__EMBEDDING_PROVIDER:-fake}
  HAL9000_VECTOR__EMBEDDING_DIMENSION: ${HAL9000_VECTOR__EMBEDDING_DIMENSION:-1536}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-hal9000}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-hal9000-dev-secret}
  AWS_DEFAULT_REGION: ${HAL9000_STORAGE_REGION:-us-east-1}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

x-hal-service: &hal-service
  build:
    context: ..
    dockerfile: Dockerfile
  image: hal9000:local
  env_file:
    - ./env.example
  environment:
    <<: *hal-env
  depends_on:
    postgres:
      condition: service_healthy
    object-store:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hal9000}
      POSTGRES_USER: hal9000
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hal9000-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hal9000 -d ${POSTGRES_DB:-hal9000}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${HAL9000_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hal9000}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hal9000-dev-secret}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${HAL9000_OBJECT_STORE_PORT:-9002}:9000"
      - "${HAL9000_OBJECT_STORE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object-store-data:/data

  object-store-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hal9000}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hal9000-dev-secret}
      HAL9000_STORAGE_BUCKET: ${HAL9000_STORAGE_BUCKET:-hal9000-artifacts}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://object-store:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${HAL9000_STORAGE_BUCKET};
      mc anonymous set none local/$${HAL9000_STORAGE_BUCKET};
      "

  migrate:
    <<: *hal-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap:
    <<: *hal-service
    command:
      - hal
      - --profile
      - production
      - research
      - bootstrap
      - --project-slug
      - ${HAL9000_BOOTSTRAP_PROJECT_SLUG:-firm-research}
      - --project-name
      - ${HAL9000_BOOTSTRAP_PROJECT_NAME:-Firm Research}
      - --owner
      - ${HAL9000_BOOTSTRAP_OWNER:-research@example.com}
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully

  gateway:
    <<: *hal-service
    command:
      - hal
      - --profile
      - production
      - gateway
      - start
      - --host
      - 0.0.0.0
      - --port
      - "9000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
    ports:
      - "${HAL9000_GATEWAY_PORT:-9000}:9000"

  app-gateway:
    <<: *hal-service
    environment:
      <<: *hal-env
      HAL9000_SLACK_SIGNING_SECRET: ${HAL9000_SLACK_SIGNING_SECRET:-}
      HAL9000_SLACK_USER_MAP_JSON: ${HAL9000_SLACK_USER_MAP_JSON:-{}}
      HAL9000_GOOGLE_SHEETS_TOKEN: ${HAL9000_GOOGLE_SHEETS_TOKEN:-}
    command:
      - hal
      - --profile
      - production
      - gateway
      - http
      - --host
      - 0.0.0.0
      - --port
      - "9101"
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
    ports:
      - "${HAL9000_APP_GATEWAY_PORT:-9101}:9101"

  worker:
    <<: *hal-service
    command: >
      sh -c "while true; do
      hal --profile production research work-queue
      --limit $${HAL9000_WORKER_BATCH_SIZE:-5}
      --actor $${HAL9000_WORKER_ACTOR:-hal-compose-worker}
      --max-attempts $${HAL9000_WORKER_MAX_ATTEMPTS:-2}
      --phase-timeout-seconds $${HAL9000_WORKER_PHASE_TIMEOUT_SECONDS:-900};
      sleep $${HAL9000_WORKER_POLL_SECONDS:-30};
      done"
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully

  docs:
    <<: *hal-service
    command:
      - python
      - -m
      - mkdocs
      - serve
      - -a
      - 0.0.0.0:8000
    depends_on: []
    ports:
      - "${HAL9000_DOCS_PORT:-8000}:8000"

volumes:
  postgres-data:
  object-store-data:
